{% extends "base.html" %}
{% block title %}Upload - DevNotes{% endblock %}
{% block content %}
<h1>Upload attachment</h1>
<form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
  <input type="hidden" name="note_id" value="{{ note_id }}">
  <p><label>File <input name="file" type="file"></label></p>
  <p><button type="submit">Upload</button></p>
</form>
<p><a href="{{ url_for('note_detail', note_id=note_id) }}">Back to note</a></p>
{% endblock %}
